[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "axm-character-editor"
version = "0.1.0.dev0"
description = "Standalone family-neutral AXM character authoring foundation"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
axm-character = "axm_character_editor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axm_character_editor = [
  "data/families/*.json",
  "data/presets/*.json",
  "data/profiles/*.json"
]
