name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_editor.py --out /tmp/character-editor.html
      - run: test -s /tmp/character-editor.html
      - name: Build exact current-main source ZIP
        run: git archive --format=zip --output=/tmp/AXM-Character-Editor-main-f32f002.zip origin/main
      - name: Upload exact current-main source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: axm-character-editor-main-f32f002
          path: /tmp/AXM-Character-Editor-main-f32f002.zip
          retention-days: 1
